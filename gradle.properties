# The Paper API this extension compiles against - the same as UniversalAdmin's
# (one jar for Paper 1.21.7 and newer; Java 21 bytecode).
paperApiVersion=26.2.build.115-stable

# The UniversalAdmin release this extension is built against, from Modrinth's
# Maven repository (its jar contains the extension API). To build against a
# local UniversalAdmin build instead: -PuniversaladminJar=<path to the jar>.
universaladminVersion=1.7.0

# TAB's API (by NEZNAMY), from JitPack - provided by the TAB plugin at runtime.
tabApiVersion=6.1.2
